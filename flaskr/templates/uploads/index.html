{% extends 'base.html' %}

{% block header %}
  <h1>{% block title %}이미지 업로드{% endblock %}</h1>
  <a class="action" href="{{ url_for('index') }}">Posts</a>
{% endblock %}

{% block content %}
  <p style="margin: 0.5rem 0; font-size: 0.8rem; color: #666;">응답 서버: {{ host }}</p>
  <form method="post" action="{{ url_for('uploads.upload') }}" enctype="multipart/form-data" style="margin: 1rem 0;">
    <label for="image">이미지 (png, jpg, gif · 1MB 이하)</label>
    <input type="file" name="image" id="image" accept=".png,.jpg,.jpeg,.gif" required>
    <input type="submit" value="업로드">
  </form>
  {% for name in images %}
    <figure style="margin: 1rem 0;">
      <img src="{{ url_for('uploads.image', name=name) }}" alt="{{ name }}" style="max-width: 100%;">
      <figcaption style="font-size: 0.8rem; color: #666;">{{ name }}</figcaption>
    </figure>
  {% else %}
    <p>아직 올린 이미지가 없습니다.</p>
  {% endfor %}
{% endblock %}
